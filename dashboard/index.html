<title>Activity Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: same shell as the Finance Hub. Sticky title and scrolling tab row, one panel per tab, hairline-divided KPI strips. Single light look by design (white page, forest-green ink). */
:root{
  --bg:#FFFFFF; --ink:#14231B; --muted:#5B6D62; --line:#DDE5DE; --mist:#EEF3EE;
  --forest:#1B3A2B; --green:#2F5D43; --sage:#6F8F72; --brass:#B8934A; --brass-ink:#7A5E22; --neg:#9B3B2E;
  --chip-brass:#F4E9CF; --chip-neg:#F3E1DD; --chip-grey:#ECEFEC;
  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;margin:0;
  padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font:600 30px/1 var(--f-display);color:var(--forest);margin:0;letter-spacing:.01em}
.sync{font-size:12.5px;color:var(--muted)}
.sync button{all:unset;cursor:pointer;color:var(--green);font-weight:600;margin-left:8px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{all:unset;cursor:pointer;white-space:nowrap;padding:10px 12px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--forest);border-bottom-color:var(--brass)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
main{padding-top:20px;display:grid;gap:26px}
h2{font:600 22px/1.15 var(--f-display);color:var(--forest);margin:0;text-wrap:balance}
h3{font:600 12px var(--f-ui);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.panel{display:grid;gap:26px;min-width:0}
.panel[hidden]{display:none}
.banner{background:var(--mist);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13.5px}
.banner.warn{background:#F7EFDD;border-color:#E6D4A6;color:#5E4713}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select,input{font:500 14px var(--f-ui);color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{all:unset;cursor:pointer;padding:8px 14px;font:600 13px var(--f-ui);color:var(--forest)}
.seg button[aria-pressed="true"]{background:var(--forest);color:#fff}
.seg button:focus-visible{outline:2px solid var(--green);outline-offset:-2px}
.sec{display:grid;gap:10px;min-width:0}
.sec>*{min-width:0}
.sec .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec .hd .n{font-size:12.5px;color:var(--muted)}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi{padding:14px 14px 14px 0;min-width:0}
.kpi:nth-child(even){padding-left:14px;border-left:1px solid var(--line)}
.kpi:nth-child(n+3){border-top:1px solid var(--line)}
.kpi:last-child:nth-child(odd){grid-column:1/-1}
.kpi .v{font:600 30px/1.05 var(--f-display);color:var(--forest);font-variant-numeric:lining-nums tabular-nums;margin-top:4px;overflow-wrap:anywhere}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi .bar{height:5px;background:var(--mist);border-radius:3px;margin-top:8px;overflow:hidden}
.kpi .bar i{display:block;height:100%;background:var(--green);border-radius:3px}
@media (min-width:720px){.kpis{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}.kpi,.kpi:nth-child(even),.kpi:nth-child(n+3){padding:14px;border-top:0;border-left:1px solid var(--line)}.kpi:first-child{padding-left:0;border-left:0}.kpi:last-child:nth-child(odd){grid-column:auto}}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13.5px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--mist)}
th.l,td.l{text-align:left}
td.wrap-t{white-space:normal;min-width:160px}
tr:last-child td{border-bottom:0}
tr.total td{font-weight:700;background:var(--mist)}
td.neg{color:var(--neg)} td.dim,.dim{color:var(--muted)}

.meter{display:flex;height:14px;background:var(--mist);border-radius:7px;overflow:hidden}
.meter i{display:block;height:100%}
.legend{display:flex;gap:6px 16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend span{white-space:nowrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}

.chip{display:inline-block;font:600 11.5px var(--f-ui);padding:2px 8px;border-radius:99px;background:var(--chip-grey);color:var(--muted);white-space:nowrap}
.chip.booked{background:var(--mist);color:var(--forest)}
.chip.follow{background:var(--chip-brass);color:var(--brass-ink)}
.chip.ni{background:var(--chip-neg);color:var(--neg)}

.list{display:grid;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.item .d{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .p{font-weight:600;overflow-wrap:anywhere}
.item .m{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:26px 32px}
.empty{border:1px dashed var(--sage);border-radius:8px;padding:20px 18px;color:var(--muted);max-width:62ch}
.empty b{color:var(--forest)}
.more{all:unset;cursor:pointer;color:var(--green);font-weight:600;font-size:13.5px;padding:6px 0}
.lnk{color:var(--green);font-weight:600;text-decoration:none;white-space:nowrap}
.lnk:hover{text-decoration:underline}
.chartbox{overflow-x:auto}
svg text{font-family:var(--f-ui)}
.ax{fill:var(--muted);font-size:11px}
.lbl{fill:var(--forest);font-size:11.5px;font-weight:600}
button.chip{border:0;cursor:pointer;font-family:var(--f-ui)}
button.chip:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.srow{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr);gap:4px 18px;padding:12px 0;border-top:1px solid var(--line)}
.srow .stime{font-size:13px;color:var(--muted)}
.srow .p{font-weight:600}
.srow .m{font-size:13px;color:var(--muted)}
.srow .snote{font-size:14px;line-height:1.5;margin-top:4px;overflow-wrap:anywhere}
.day{display:grid;gap:4px}
.day .dh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.step{display:grid;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.step .sh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.step .sh b{font:600 19px var(--f-display);color:var(--forest)}
.step p{margin:0;max-width:75ch}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px 22px}
.sgrid>div{display:grid;gap:3px;font-size:13.5px;align-content:start}
details.scr{border-top:1px solid var(--line);padding:2px 0}
details.scr summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:11px 0}
details.scr summary::-webkit-details-marker{display:none}
details.scr summary::before{content:"+";color:var(--sage);font-weight:700;width:12px}
details.scr[open] summary::before{content:"–"}
details.scr summary:focus-visible{outline:2px solid var(--green);outline-offset:2px}
details.scr .sn{font-weight:600}
.scr .use{font-size:13px;color:var(--muted);margin:0 0 8px;max-width:75ch}
.scr .txt{white-space:pre-wrap;background:var(--mist);border-radius:8px;padding:12px 14px;margin:0 0 10px;max-width:75ch;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.scr .cp{all:unset;cursor:pointer;color:var(--green);font-weight:600;font-size:13.5px;margin-bottom:10px;display:inline-block}
.scr .cp:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.nt{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line);max-width:80ch}
.nt p{margin:0;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
@media (max-width:620px){.srow{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){h1{font-size:27px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
<header class="top">
  <div class="brand"><h1>Activity Hub</h1><div class="sync" id="sync">Loading…</div></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<main>
  <div id="banner" class="banner" hidden></div>
  <section class="panel" id="p-dashboard"></section>
  <section class="panel" id="p-plan" hidden></section>
  <section class="panel" id="p-leads" hidden></section>
  <section class="panel" id="p-calllist" hidden></section>
  <section class="panel" id="p-schedule" hidden></section>
  <section class="panel" id="p-cadence" hidden></section>
  <section class="panel" id="p-scripts" hidden></section>
  <section class="panel" id="p-activity" hidden></section>
  <section class="panel" id="p-stats" hidden></section>
  <section class="panel" id="p-production" hidden></section>
</main>
</div>

<script>
(function(){
"use strict";
// Sheet ID is filled in when the page is published (see README). It is never committed to the public repo.
const SID="__SHEET_ID__", SRV="Google Sheets";
// Add a tab: append it here, add a <section id="p-NAME"> above and a render function below.
const TABS=[["dashboard","Dashboard"],["plan","Monthly Plan"],["leads","Leads"],["calllist","Call list"],["schedule","Weekly schedule"],["cadence","Cadence"],["scripts","Scripts"],["activity","Activity"],["stats","Stats"],["production","Production"]];
// November 2026 plan, from the "November 20k ALP Plan" tab.
// n8n page where a past appointment is marked as held or no-show (the booking ID goes on the end).
const OUTCOME_URL="https://haleyeliiiiza.app.n8n.cloud/webhook/appt-outcome?booking=";
const PLAN={month:"2026-11",goal:20000,avg:1000,close:0.30,pres:67,sales:20,
  weeks:[{label:"Nov 2–6",start:"2026-11-02",end:"2026-11-06",pres:16,sales:5},{label:"Nov 9–13",start:"2026-11-09",end:"2026-11-13",pres:16,sales:5},
         {label:"Nov 16–20",start:"2026-11-16",end:"2026-11-20",pres:16,sales:5},{label:"Nov 23–30",start:"2026-11-23",end:"2026-11-30",pres:19,sales:5}]};

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fd=s=>{if(!s)return"";const p=s.split("-");return MON[+p[1]-1]+" "+(+p[2])};
const now0=new Date(), TODAY=iso(now0.getFullYear(),now0.getMonth()+1,now0.getDate());
const num=v=>{const n=parseFloat(String(v??"").replace(/[^0-9.\-]/g,""));return isFinite(n)?n:0};
const money=n=>"$"+Math.round(n||0).toLocaleString("en-CA");
const pct=(a,b)=>b>0?(Math.round(a/b*1000)/10)+"%":"—";
const n1=n=>isFinite(n)?(Math.round(n*10)/10).toLocaleString("en-CA"):"—";
function parseDate(s,defY){s=String(s??"").trim();let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return iso(m[1],+m[2],+m[3]);
  if((m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/)))return iso(m[3],+m[1],+m[2]);
  if((m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{2})\b/)))return iso(2000+ +m[3],+m[1],+m[2]);
  if(defY&&(m=s.match(/^(\d{1,2})\/(\d{1,2})$/)))return iso(defY,+m[1],+m[2]);
  return null}

/* ---------- plan calendar: weekdays in November ---------- */
const WORKDAYS=[]; for(let d=1;d<=30;d++){const dow=new Date(Date.UTC(2026,10,d)).getUTCDay(); if(dow>=1&&dow<=5)WORKDAYS.push(iso(2026,11,d))}
const weekOf=d=>PLAN.weeks.find(w=>d>=w.start&&d<=w.end);
const planDay=d=>{const w=weekOf(d);if(!w)return 0;const n=WORKDAYS.filter(x=>x>=w.start&&x<=w.end).length;return PLAN.avg*w.sales/n};

/* ---------- state ---------- */
const S={ef:{sort:"newest",limit:25},af:{y:TODAY.slice(0,4),m:TODAY.slice(5,7),d:"all"},stv:"month",mcp:null,tab:"dashboard",loaded:false,err:{},at:null,tracker:[],leads:[],queue:[],stats:null,sched:[],cadence:[],scripts:[],plan:[],
  lf:{type:"all",status:"all",q:"",limit:40},cf:{type:"all",prov:"all",cohort:"all",step:"all",q:"",limit:40},sf:{view:"upcoming"},sc:{q:""}};
try{const t=localStorage.getItem("ah:tab");if(t&&TABS.some(x=>x[0]===t))S.tab=t}catch(e){}
{const h=(location.hash||"").slice(1);if(TABS.some(x=>x[0]===h))S.tab=h}

/* ---------- loading ---------- */
function errMsg(e){const c=e&&e.code;
  return c==="needs_reauth"?"Google Sheets needs reconnecting: claude.ai Settings → Connectors."
  :c==="server_not_connected"?"Add Google Sheets in claude.ai Settings → Connectors, then reload."
  :c==="approval_required"||c==="not_in_manifest"||c==="consent_required"?"Allow this page to use Google Sheets when Claude asks, then tap Refresh."
  :c==="server_unavailable"?"Google Sheets didn't answer. Wait a moment and tap Refresh."
  :"Couldn't reach Google Sheets ("+(c||"error")+"). Tap Refresh to try again."}
function showBanner(msg){const b=$("banner");if(!msg){b.hidden=true;b.className="banner";return}b.hidden=false;b.className="banner warn";b.textContent=msg}
async function getRange(range){const r=await S.mcp.callTool(SRV,"get_values",{spreadsheetId:SID,range},{cache:false});return (r.payload&&r.payload.values)||[]}

const connected=n=>/^connected/i.test(n)&&!/no answer|voicemail|call control/i.test(n);
function parseTracker(v){return v.filter(r=>r[0]||r[1]).map(r=>{const notes=String(r[7]||"");
  return {date:parseDate(r[0]),type:String(r[1]||"").trim(),name:String(r[2]||"").trim(),premium:num(r[5]),source:String(r[6]||"").trim(),
    notes,disp:notes.split("|")[0].trim(),conn:connected(notes),dir:(t=>t==="Text Reply"?"in":t==="Text"?"out":t==="Call"?(/inbound/i.test(notes)?"in":"out"):"")(String(r[1]||"").trim()),interview:/interview/i.test(notes),list:String(r[9]||"").trim(),appt:String(r[10]||"").trim(),bid:String(r[11]||"").trim(),phone:String(r[3]||"").trim(),email:String(r[4]||"").trim().toLowerCase()}}).filter(r=>r.date)}
// A booking is canceled when a Booking Canceled row shares its Booking ID, or its name and appointment time (rows logged before Booking IDs existed).
function markCanceled(T){const ids=new Set(),keys=new Set();T.filter(r=>r.type==="Booking Canceled").forEach(r=>{if(r.bid)ids.add(r.bid);if(r.appt)keys.add(r.name.toLowerCase()+"|"+r.appt)});
  T.forEach(r=>{r.canceled=r.type==="Appointment Set"&&Boolean((r.bid&&ids.has(r.bid))||(r.appt&&keys.has(r.name.toLowerCase()+"|"+r.appt)))});return T}
// Past appointments get an outcome from a Presentation Held / No-Show row with the same Booking ID, or (older manual entries) the same contact on or after the appointment day.
function markOutcome(T){const oc=T.filter(r=>r.type==="Presentation Held"||r.type==="No-Show"),lc=x=>String(x||"").trim().toLowerCase(),dg=x=>String(x||"").replace(/\D/g,"").slice(-10);
  T.forEach(r=>{r.outcome="";if(r.type!=="Appointment Set"||r.canceled||!r.appt)return;
    const o=oc.find(x=>(x.bid&&x.bid===r.bid)||(x.date>=r.appt.slice(0,10)&&((x.email&&x.email===r.email)||(dg(x.phone)&&dg(x.phone)===dg(r.phone))||(lc(x.name)&&lc(x.name)===lc(r.name)))));
    if(o)r.outcome=o.type==="No-Show"?"noshow":"held"});return T}
const reginaStamp=ms=>new Date(ms).toLocaleString("sv-SE",{timeZone:"America/Regina"}).slice(0,16);
const apptTime=a=>{const m=String(a||"").match(/(\d{2}):(\d{2})$/);if(!m)return "";const h=+m[1];return ((h%12)||12)+":"+m[2]+(h<12?" AM":" PM")};
function statusOf(o){o=String(o||"").trim();if(!o)return "Untouched";
  if(/booked/i.test(o))return "Booked"; if(/unreachable|bad number/i.test(o))return "Unreachable";
  if(/not interested|not for me/i.test(o))return "Not interested";
  if(/text reply|talked|will call|mail it|located will|call me/i.test(o))return "Follow-up";
  return "No answer"}
function parseLeads(v){return v.filter(r=>r[2]).map(r=>({inbox:String(r[0]||"").trim(),type:String(r[1]||"").trim(),name:String(r[2]).trim(),phone:String(r[3]||"").trim(),prov:String(r[4]||"").trim(),
  dials:num(r[6]),texts:num(r[8]),pres:parseDate(r[9],2026),outcome:String(r[10]||"").trim(),status:statusOf(r[10])}))}
function parseQueue(v){return v.filter(r=>r[4]).map(r=>({type:String(r[1]||"").trim(),prov:String(r[2]||"").trim(),cohort:String(r[3]||"").trim(),name:String(r[4]).trim(),phone:String(r[5]||"").trim(),
  block:String(r[6]||"").trim(),texts:String(r[7]||"").trim(),dials:String(r[8]||"").trim(),next:String(r[9]||"").trim(),step:String(r[9]||"").split(/ - | – /)[0].trim()||"No next step",notes:String(r[10]||"").trim()}))}
function parseLong(s){const m=String(s).match(/([A-Za-z]{3})\w*\s+(\d{1,2}),\s*(\d{4})/);if(!m)return null;const mi=MON.findIndex(x=>x.toLowerCase()===m[1].toLowerCase());return mi<0?null:iso(m[3],mi+1,+m[2])}
const cell=(r,i)=>String(r[i]||"").trim();
function parseSched(v){return v.filter(r=>r.some(c=>String(c||"").trim())).map(r=>{const day=cell(r,0);
  return {day,date:parseLong(day),actual:/actual/i.test(day),label:day.replace(/\s*-\s*ACTUAL/i,"").replace(/,\s*\d{4}$/,""),time:cell(r,1),group:cell(r,2),activity:cell(r,3),notes:cell(r,4),script:cell(r,5)}})}
const parseCadence=v=>v.filter(r=>cell(r,0)).map(r=>({attempt:cell(r,0),when:cell(r,1),channel:cell(r,2),action:cell(r,3),none:cell(r,4),yes:cell(r,5),no:cell(r,6)}));
// These plan rows are left out of the page (they stay on the sheet).
const HIDE_PLAN=/^(close rate|risk \/ note|new tracker in november|daily contact pace|if presentation rate is lower|lead pool|total check|daily tracking)/i;
const parsePlan=v=>v.filter(r=>cell(r,0)&&!HIDE_PLAN.test(cell(r,0))).map(r=>({label:cell(r,0),detail:cell(r,1)}));
const parseScripts=v=>v.filter(r=>cell(r,0)).map(r=>({name:cell(r,0),use:cell(r,1),text:cell(r,2)}));
const SK=["dials","conn","texts","replies","made","shown","noshow","pres","sales","alp"];
function parseStats(v){if(!v.length)return null;const h=(v[0]||[]).map(x=>String(x||""));
  const map={dials:/^dials/i,conn:/connection/i,texts:/texts sent/i,replies:/repl/i,made:/made/i,shown:/shown/i,noshow:/no-?show/i,pres:/^presentations/i,sales:/^sales/i,alp:/alp/i};
  const col={};for(const k in map){const i=h.findIndex(x=>map[k].test(x));if(i>0)col[k]=i}
  const mk=r=>{const o={};SK.forEach(k=>o[k]=col[k]!=null?num(r[col[k]]):0);return o};
  const out={base:null,baseLabel:"",days:[]};
  for(const r of v.slice(1)){const a=String(r[0]||"").trim();if(!a)continue;if(/^cumulative/i.test(a))break;
    if(/^mtd/i.test(a)){out.base=mk(r);out.baseLabel=a;out.baseDate=parseDate(a,2026);continue}
    const d=parseDate(a,2026);if(d){const o=mk(r);o.date=d;out.days.push(o)}}
  out.days.sort((x,y)=>x.date<y.date?-1:1);return out}
const MONTH=TODAY.slice(0,7), MONTH_NAME=["January","February","March","April","May","June","July","August","September","October","November","December"][+MONTH.slice(5)-1];
// Stats rows for the current month. The "MTD to <date>" opening row counts only when its date is in the current month.
// Dials and conversations come from the Tracker (Kixie) for any day it has call rows; every other number comes from the Stats tab.
function kixieDays(){const m={},blank=()=>({dials:0,conn:0,texts:0,replies:0,made:0,shown:0,noshow:0,call:false,txt:false,bk:false,oc:false});
  S.tracker.filter(r=>r.date.startsWith(MONTH)).forEach(r=>{
    const book=r.type==="Appointment Set"&&!r.interview;
    if(r.type!=="Call"&&r.type!=="Text"&&r.type!=="Text Reply"&&!book)return;
    const d=m[r.date]=m[r.date]||blank();
    if(r.type==="Call"){d.call=true;d.dials++;if(r.conn)d.conn++}else if(book){d.bk=true;if(!r.canceled)d.made++}else{d.txt=true;if(r.type==="Text")d.texts++;else d.replies++}});
  // shown and no-shows count on the appointment day when the row has one, otherwise the day it was logged
  S.tracker.filter(r=>r.type==="Presentation Held"||r.type==="No-Show").forEach(r=>{const dt=r.appt?r.appt.slice(0,10):r.date;if(!dt.startsWith(MONTH))return;
    const d=m[dt]=m[dt]||blank();d.oc=true;if(r.type==="Presentation Held")d.shown++;else d.noshow++});
  return m}
const kixieOn=()=>S.tracker.some(r=>r.type==="Call"&&r.date.startsWith(MONTH));
const kixieBookOn=()=>S.tracker.some(r=>r.type==="Appointment Set"&&!r.interview&&r.date.startsWith(MONTH));
const kixieTextOn=()=>S.tracker.some(r=>(r.type==="Text"||r.type==="Text Reply")&&r.date.startsWith(MONTH));
function statDays(all){if(!S.stats)return [];if(all)return S.stats.days;
  const base=S.stats.days.filter(d=>d.date.startsWith(MONTH)),k=kixieDays(),dates=Object.keys(k);if(!dates.length)return base;
  const by={};base.forEach(d=>by[d.date]={...d});
  dates.forEach(dt=>{const o=by[dt]=by[dt]||Object.fromEntries([...SK.map(x=>[x,0]),["date",dt]]);const k0=k[dt];if(k0.call){o.dials=k0.dials;o.conn=k0.conn}if(k0.txt){o.texts=k0.texts;o.replies=k0.replies}if(k0.bk)o.made=k0.made;if(k0.oc){o.shown=k0.shown;o.noshow=k0.noshow}});
  return Object.values(by).sort((a,b)=>a.date<b.date?-1:1)}
function totals(all){const st=S.stats;if(!st)return null;const useBase=st.base&&(all||(st.baseDate&&st.baseDate.startsWith(MONTH)));const t={};
  SK.forEach(k=>t[k]=(useBase?st.base[k]:0)+statDays(all).reduce((a,d)=>a+d[k],0));t.src=!all&&kixieOn()?"Kixie":"";t.textSrc=!all&&kixieTextOn()?"Kixie":"";t.bookSrc=!all&&kixieBookOn()?"Tracker":"";return t}

async function load(){
  $("sync").textContent="Loading…";
  if(!S.mcp){try{S.mcp=(window.claude&&window.claude.use)?await window.claude.use("mcp"):null}catch(e){S.mcp=null}}
  if(!S.mcp){S.loaded=true;showBanner("This page reads your Master Lead/Activity Tracker sheet, so open it inside Claude (claude.ai) to see your data.");$("sync").textContent="Not connected";renderAll();return}
  const jobs={tracker:getRange("Tracker!A2:L5000"),leads:getRange("'All Leads Master'!A2:K1100"),queue:getRange("'Call Lists'!A2:K1100"),stats:getRange("Stats!A5:L35"),sched:getRange("'Weekly Schedule'!A2:F80"),cadence:getRange("Cadence!A2:G40"),scripts:getRange("Scripts!A2:C60"),plan:getRange("'November 20k ALP Plan'!A2:B40")};
  const keys=Object.keys(jobs), res=await Promise.allSettled(keys.map(k=>jobs[k]));
  S.err={};let bad=0,first=null;
  res.forEach((r,i)=>{const k=keys[i];if(r.status==="fulfilled"){const v=r.value;
      if(k==="tracker")S.tracker=markOutcome(markCanceled(parseTracker(v)));else if(k==="leads")S.leads=parseLeads(v);else if(k==="queue")S.queue=parseQueue(v);else if(k==="sched")S.sched=parseSched(v);else if(k==="cadence")S.cadence=parseCadence(v);else if(k==="scripts")S.scripts=parseScripts(v);else if(k==="plan")S.plan=parsePlan(v);else S.stats=parseStats(v)}
    else{S.err[k]=r.reason;bad++;first=first||r.reason}});
  S.loaded=true;S.at=new Date();
  showBanner(bad===keys.length?errMsg(first):bad?"Some data didn't load ("+keys.filter(k=>S.err[k]).join(", ")+"). "+errMsg(first):"");
  $("sync").innerHTML=`Updated ${S.at.toLocaleTimeString("en-CA",{hour:"numeric",minute:"2-digit"})}<button id="refresh">Refresh</button>`;
  renderAll();
}

     `<div class="seg" role="group" aria-label="Days"><button data-sv="upcoming" aria-pressed="${f.view==="upcoming"}">From today</button><button data-sv="all" aria-pressed="${f.view==="all"}">All days</button></div>`+
     (vis.length?vis.map(dayHtml).join(""):empty(days.length?"Nothing scheduled from today.":"The schedule is empty.",days.length?"Switch to All days to see earlier entries.":"Add rows to the Weekly Schedule tab.")))+
   (notes.length?sec("Notes","",notes.map(noteHtml).join("")):"")}

/* ---------- Cadence ---------- */
function renderCadence(){
  const C=S.cadence;
  $("p-cadence").innerHTML=srcNote("cadence")+sec("Lead cadence","how often to text and call each lead",C.length?
    C.map(c=>`<div class="step"><div class="sh"><b>${esc(c.attempt)}</b>${c.channel?`<span class="chip booked">${esc(c.channel)}</span>`:""}${c.when?`<span class="dim">${esc(c.when)}</span>`:""}</div><p>${esc(c.action)}</p>${c.none||c.yes||c.no?`<div class="sgrid"><div><h3>No answer</h3>${esc(c.none)}</div><div><h3>Interested or answers</h3>${esc(c.yes)}</div><div><h3>Not interested</h3>${esc(c.no)}</div></div>`:""}</div>`).join("")
    :empty("No cadence yet.","Add steps to the Cadence tab."))}

/* ---------- Scripts ---------- */
const scrGroup=n=>/^(call script|voicemail)/i.test(n)?"Calls":/^objection/i.test(n)?"Objections":"Texts";
const scrText=t=>String(t).replace(/\s(Pivot:|If yes:|Variants:)/g,"\n\n$1").replace(/\s-\s(DRAFT)/,"\n\n$1");
function scriptItems(){const q=S.sc.q.trim().toLowerCase(),out=[];
  ["Texts","Calls","Objections"].forEach(g=>{const L=S.scripts.map((x,i)=>({...x,i})).filter(x=>scrGroup(x.name)===g&&(!q||(x.name+" "+x.use+" "+x.text).toLowerCase().includes(q)));
    if(!L.length)return;out.push(`<h3 style="margin-top:8px">${g}</h3>`+L.map(x=>`<details class="scr"><summary><span class="sn">${esc(x.name)}</span>${/draft/i.test(x.name+x.text)?'<span class="chip follow">Draft: approve first</span>':""}</summary><p class="use">${esc(x.use)}</p><div class="txt">${esc(scrText(x.text))}</div><button class="cp" data-copy="${x.i}">Copy</button></details>`).join(""))});
  return out.length?out.join(""):empty("No scripts match.","Try another word.")}
function renderScripts(){
  $("p-scripts").innerHTML=srcNote("scripts")+sec("Scripts",`${S.scripts.length} scripts`,S.scripts.length?`<div class="row"><input id="sc-q" type="search" placeholder="Search scripts" value="${esc(S.sc.q)}" aria-label="Search scripts"></div><div id="sc-results">${scriptItems()}</div>`:empty("No scripts yet.","Add rows to the Scripts tab."))}
async function copyText(t,btn){try{await navigator.clipboard.writeText(t);btn.textContent="Copied"}catch(e){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");btn.textContent="Copied"}catch(_){btn.textContent="Select the text and copy"}ta.remove()}setTimeout(()=>{btn.textContent="Copy"},1800)}

/* ---------- Activity ---------- */
const MONTHS_FULL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const pad2=n=>String(n).padStart(2,"0");
const SORTS=[["newest","Newest first"],["oldest","Oldest first"],["name","Contact name A–Z"],["namez","Contact name Z–A"],["in","Incoming first"],["out","Outgoing first"]];
function sortEntries(R,mode){const rows=R.map((r,i)=>({r,i}));
  const nd=(a,b)=>a.r.date<b.r.date?1:a.r.date>b.r.date?-1:b.i-a.i, rank=(x,first)=>x.r.dir===first?0:x.r.dir?1:2, nm=(a,b)=>a.r.name.localeCompare(b.r.name,undefined,{sensitivity:"base"});
  const cmp={newest:nd,oldest:(a,b)=>-nd(a,b),name:(a,b)=>nm(a,b)||nd(a,b),namez:(a,b)=>-nm(a,b)||nd(a,b),in:(a,b)=>rank(a,"in")-rank(b,"in")||nd(a,b),out:(a,b)=>rank(a,"out")-rank(b,"out")||nd(a,b)}[mode]||nd;
  return rows.sort(cmp).map(x=>x.r)}
function actLabel(f){if(f.y==="all")return "All time";if(f.m==="all")return f.y;const mn=MONTHS_FULL[+f.m-1];return f.d==="all"?mn+" "+f.y:mn+" "+(+f.d)+", "+f.y}
function renderActivity(){
  const T=S.tracker;
  if(!T.length){$("p-activity").innerHTML=srcNote("tracker")+sec("Activity","",empty("The Tracker tab has no rows yet.","Calls from Kixie, the log form and Calendly bookings are added by the n8n flows. They appear here as they arrive."));return}
  const f=S.af, years=[...new Set([...T.map(r=>r.date.slice(0,4)),TODAY.slice(0,4)])].sort().reverse();
  if(f.y!=="all"&&!years.includes(f.y))f.y=years[0];
  const dim=f.y!=="all"&&f.m!=="all"?new Date(Date.UTC(+f.y,+f.m,0)).getUTCDate():31;
  if(f.m==="all"||(f.d!=="all"&&+f.d>dim))f.d="all";
  const R=T.filter(r=>{const [y,m,d]=r.date.split("-");return (f.y==="all"||y===f.y)&&(f.m==="all"||m===f.m)&&(f.d==="all"||d===f.d)});
  const sel=(id,label,opts,cur,dis)=>`<select id="${id}" aria-label="${label}"${dis?" disabled":""}>${opts.map(([v,t])=>`<option value="${v}"${String(cur)===String(v)?" selected":""}>${esc(t)}</option>`).join("")}</select>`;
  const controls=`<div class="row">${sel("af-y","Year",[["all","All years"],...years.map(y=>[y,y])],f.y)}${sel("af-m","Month",[["all","All months"],...MONTHS_FULL.map((n,i)=>[pad2(i+1),n])],f.m,f.y==="all")}${sel("af-d","Day",[["all","All days"],...Array.from({length:dim},(_,i)=>[pad2(i+1),String(i+1)])],f.d,f.m==="all")}<button class="more" id="af-reset">This month</button></div>`;
  const label=actLabel(f);
  if(f.y==="all"){f.m="all";f.d="all"}
  if(!R.length){$("p-activity").innerHTML=srcNote("tracker")+sec("Activity",esc(label),controls+empty("No activity in "+esc(label)+".","Pick another period, or tap This month."));return}
  const of=t=>R.filter(r=>r.type===t), calls=of("Call"), conv=calls.filter(r=>r.conn).length, book=of("Appointment Set").filter(r=>!r.interview&&!r.canceled).length, canc=of("Booking Canceled").length,
    pres=of("Presentation Held").length, ns=of("No-Show").length, apps=of("Application Submitted"), alp=apps.reduce((a,r)=>a+r.premium,0), tx=of("Text").length, rp=of("Text Reply").length;
  const days={};R.forEach(r=>{const d=days[r.date]=days[r.date]||{date:r.date,dials:0,conv:0,txt:0,rep:0,book:0,pres:0,ns:0,apps:0,alp:0};
    if(r.type==="Call"){d.dials++;if(r.conn)d.conv++}else if(r.type==="Text")d.txt++;else if(r.type==="Text Reply")d.rep++;else if(r.type==="Appointment Set"&&!r.interview&&!r.canceled)d.book++;else if(r.type==="Presentation Held")d.pres++;
    else if(r.type==="No-Show")d.ns++;else if(r.type==="Application Submitted"){d.apps++;d.alp+=r.premium}});
  const all=Object.values(days).sort((a,b)=>a.date<b.date?1:-1), drows=all.slice(0,31);
  const lists={};calls.filter(r=>r.list).forEach(r=>{const l=lists[r.list]=lists[r.list]||{n:r.list,d:0,c:0};l.d++;if(r.conn)l.c++});
  const sorted=sortEntries(R,S.ef.sort), shown=sorted.slice(0,S.ef.limit), multi=f.y==="all"||f.m==="all";
  $("p-activity").innerHTML=srcNote("tracker")+
   sec("Activity",esc(label)+` · ${R.length} ${R.length===1?"entry":"entries"}`,controls+`<div class="kpis">${kpi("Dials",calls.length,"Kixie calls")}${kpi("Conversations",conv,pct(conv,calls.length)+" of dials")}${kpi("Texts",tx,rp+(rp===1?" reply":" replies"))}${kpi("Bookings",book,(canc?canc+" canceled · ":"")+"interviews left out")}${kpi("Presentations",pres,ns+" no-shows")}${kpi("Applications",apps.length,money(alp)+" ALP")}</div>`)+
   (f.d==="all"?sec("By day",all.length>31?"latest 31 days with activity":`${all.length} ${all.length===1?"day":"days"} with activity`,table(["Day","Dials","Convos","Texts","Replies","Bookings","Pres.","No-shows","Apps","ALP"],drows.map(d=>tr([f.y==="all"||f.m==="all"?fd(d.date)+" "+d.date.slice(0,4):fd(d.date),d.dials,d.conv,d.txt,d.rep,d.book,d.pres,d.ns,d.apps,money(d.alp)])))):"")+
   (Object.keys(lists).length?sec("By power list","",table(["List","Dials","Convos","Reach"],Object.values(lists).sort((a,b)=>b.d-a.d).map(l=>tr([esc(l.n),l.d,l.c,pct(l.c,l.d)])))):"")+
   sec("Entries",`${R.length} in ${esc(label)}`,`<div class="row"><select id="ef-sort" aria-label="Sort entries">${SORTS.map(([v,t])=>`<option value="${v}"${S.ef.sort===v?" selected":""}>${t}</option>`).join("")}</select></div>
     <div class="list">${shown.map(r=>`<div class="item"><span class="d">${fd(r.date)}${multi?"<br>"+r.date.slice(0,4):""}</span><span><span class="p">${esc(r.type)}</span> <span class="dim">${esc(r.name)}</span><br><span class="m">${esc(r.type==="Text"||r.type==="Text Reply"?r.notes:r.disp)}</span></span><span class="dim">${r.dir?`<span class="chip${r.dir==="in"?" booked":""}">${r.dir==="in"?"Incoming":"Outgoing"}</span> `:""}${esc(r.source)}</span></div>`).join("")}</div>${sorted.length>shown.length?`<button class="more" id="ef-more">Show 25 more</button>`:""}`)
}

/* ---------- Stats ---------- */
function barChart(days){
  if(!days.length)return "";const W=640,H=210,L=38,R=10,T=14,B=30,mx=Math.max(10,...days.map(d=>d.dials)),step=Math.pow(10,Math.floor(Math.log10(mx))),top=Math.ceil(mx/step)*step;
  const y=v=>T+(H-T-B)*(1-v/top), bw=Math.min(46,(W-L-R)/days.length/2.6), cw=(W-L-R)/days.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Dials and conversations by day" style="min-width:${Math.min(W,120+days.length*60)}px">`;
  [0,.5,1].forEach(f=>{const v=top*f;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#DDE5DE"/><text class="ax" x="${L-6}" y="${y(v)+4}" text-anchor="end">${Math.round(v)}</text>`});
  days.forEach((d,i)=>{const cx=L+cw*i+cw/2;
    s+=`<rect x="${cx-bw-1}" y="${y(d.dials)}" width="${bw}" height="${H-B-y(d.dials)}" fill="#2F5D43" rx="2"><title>${fd(d.date)}: ${d.dials} dials</title></rect><text class="lbl" x="${cx-bw/2-1}" y="${y(d.dials)-4}" text-anchor="middle">${d.dials}</text>`+
       `<rect x="${cx+1}" y="${y(d.conn)}" width="${bw}" height="${H-B-y(d.conn)}" fill="#B8934A" rx="2"><title>${fd(d.date)}: ${d.conn} conversations</title></rect><text class="lbl" x="${cx+bw/2+1}" y="${y(d.conn)-4}" text-anchor="middle">${d.conn}</text>`+
       `<text class="ax" x="${cx}" y="${H-10}" text-anchor="middle">${fd(d.date)}</text>`});
  return `<div class="chartbox">${s}</svg></div><div class="legend"><span><i style="background:#2F5D43"></i>Dials</span><span><i style="background:#B8934A"></i>Conversations</span></div>`}
function renderStats(){
  const st=S.stats, all=S.stv==="all", t=totals(all), days=statDays(all);
  if(!st||!t){$("p-stats").innerHTML=srcNote("stats")+sec("Stats","",empty("No daily stats yet.","Fill in one row per day on the Stats tab of the sheet."));return}
  const rate=(a,b,f)=>[a,b,f];
  const rates=[["Dials that reach someone",pct(t.conn,t.dials),"Conversations ÷ dials"],["Texts that get a reply",pct(t.replies,t.texts),"Replies ÷ texts sent"],["Conversations that book",pct(t.made,t.conn),"Bookings ÷ conversations"],
    ["Bookings that show",pct(t.shown,t.made),"Shown ÷ bookings made"],["Bookings that no-show",pct(t.noshow,t.made),"No-shows ÷ bookings made"],["Dials per conversation",n1(t.conn?t.dials/t.conn:NaN),"Dials ÷ conversations"],["Dials per booking",n1(t.made?t.dials/t.made:NaN),"Dials ÷ bookings made"]];
  $("p-stats").innerHTML=srcNote("stats")+
   `<div class="seg" role="group" aria-label="Period"><button data-stv="month" aria-pressed="${!all}">${MONTH_NAME}</button><button data-stv="all" aria-pressed="${all}">All time</button></div>`+
   sec(all?"All time":MONTH_NAME+" so far",all?(st.base?`includes ${esc(st.baseLabel)}`:""):(st.base&&st.baseDate&&st.baseDate.startsWith(MONTH)?`includes ${esc(st.baseLabel)}`:"daily rows dated "+MONTH_NAME),`<div class="kpis">${kpi("Dials",t.dials.toLocaleString("en-CA"),all?"":t.src?"from Kixie":"from the Stats tab")}${kpi("Conversations",t.conn,pct(t.conn,t.dials)+" of dials")}${kpi("Texts sent",t.texts,pct(t.replies,t.texts)+" replied"+(t.textSrc?" · from Kixie":""))}${kpi("Bookings made",t.made,pct(t.shown,t.made)+" showed")}${kpi("Shown",t.shown,t.noshow+" no-shows")}</div>`)+
   sec("Rates","",table(["Measure","Result","How"],rates.map(r=>tr([esc(r[0]),`<b>${r[1]}</b>`,`<span class="dim">${esc(r[2])}</span>`],{left:[2]})),{left:[2]}))+
   sec("Daily",all?"from the Stats tab, month-to-date row not included":"dials, conversations and texts from Kixie when logged, the rest from the Stats tab",days.length?barChart(days):empty("No daily rows for "+(all?"any month":MONTH_NAME)+" yet.","Add a row for each day you work on the Stats tab."))+
   (days.length?table(["Day","Dials","Convos","Texts","Replies","Booked","Shown","No-show"],[...days].reverse().map(d=>tr([fd(d.date),d.dials,d.conn,d.texts,d.replies,d.made,d.shown,d.noshow]))):"")
}

/* ---------- Production ---------- */
function prodChart(N){
  const W=640,H=230,L=46,R=64,T=14,B=30,n=WORKDAYS.length,x=i=>L+(W-L-R)*(i/(n-1)),y=v=>T+(H-T-B)*(1-v/PLAN.goal);
  let cum=0;const plan=WORKDAYS.map(d=>(cum+=planDay(d)));cum=0;
  const act=WORKDAYS.map(d=>(cum+=N.apps.filter(r=>r.date===d).reduce((a,r)=>a+r.premium,0)));
  const ti=WORKDAYS.filter(d=>d<=TODAY).length-1;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Cumulative ALP against plan" style="min-width:480px">`;
  [0,.5,1].forEach(f=>{const v=PLAN.goal*f;s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#DDE5DE"/><text class="ax" x="${L-6}" y="${y(v)+4}" text-anchor="end">$${v/1000}k</text>`});
  [0,5,10,15,20].filter(i=>i<n).forEach(i=>s+=`<text class="ax" x="${x(i)}" y="${H-10}" text-anchor="middle">${fd(WORKDAYS[i])}</text>`);
  s+=`<polyline fill="none" stroke="#B8934A" stroke-width="2" stroke-dasharray="5 4" points="${plan.map((v,i)=>x(i)+","+y(v)).join(" ")}"/>`+
     `<text class="lbl" x="${x(n-1)+6}" y="${y(plan[n-1])+4}" style="fill:#7A5E22">Plan</text>`;
  if(ti>=0){s+=`<polyline fill="none" stroke="#2F5D43" stroke-width="2.5" points="${act.slice(0,ti+1).map((v,i)=>x(i)+","+y(v)).join(" ")}"/><circle cx="${x(ti)}" cy="${y(act[ti])}" r="4" fill="#2F5D43"/>`+
     `<text class="lbl" x="${x(ti)+7}" y="${y(act[ti])-8}">${money(act[ti])}</text>`}
  return `<div class="chartbox">${s}</svg></div><div class="legend"><span><i style="background:#2F5D43"></i>Actual ALP submitted</span><span><i style="background:#B8934A"></i>Plan, spread over the weekdays of each week</span></div>`}
function renderProduction(){
  const N=nov(), pres=N.pres||N.presFromStats, remaining=WORKDAYS.filter(d=>d>=TODAY).length||1, sales=N.apps.length;
  const wrows=PLAN.weeks.map(w=>{const a=weekNums(w,N), cur=TODAY>=w.start&&TODAY<=w.end;
    return tr([esc(w.label)+(cur?` <span class="chip booked">now</span>`:""),w.pres,a.pres,w.sales,a.sales,money(PLAN.avg*w.sales),money(a.alp)])});
  $("p-production").innerHTML=srcNote("tracker")+
   sec("November production",`goal ${money(PLAN.goal)}`,`<div class="kpis">${kpi("ALP submitted",money(N.alp),pct(N.alp,PLAN.goal)+" of goal",N.alp/PLAN.goal)}${kpi("Policies",sales,`${N.issued.length} issued · plan ${PLAN.sales}`,sales/PLAN.sales)}
      ${kpi("Presentations",pres,`plan ${PLAN.pres}${N.pres?"":N.presFromStats?" · bookings shown":""}`,pres/PLAN.pres)}${kpi("Close rate",pres?pct(sales,pres):"—",`plan ${Math.round(PLAN.close*100)}%`)}${kpi("Still needed",money(Math.max(0,PLAN.goal-N.alp)),`${money(Math.max(0,PLAN.goal-N.alp)/remaining)} per working day`)}</div>`)+
   sec("Against plan","",prodChart(N))+
   sec("Week by week","",table(["Week","Pres. plan","Pres.","Sales plan","Sales","ALP plan","ALP"],wrows))+
   `<div class="banner">Plan: ${money(PLAN.avg)} average policy, ${Math.round(PLAN.close*100)}% close rate, ${PLAN.pres} presentations, ${WORKDAYS.length} weekdays. Sales and ALP count Application Submitted entries; presentations count Presentation Held entries, or bookings shown on the Stats tab until those are logged.</div>`
}

/* ---------- shell ---------- */
const R={dashboard:renderDashboard,plan:renderPlan,leads:renderLeads,calllist:renderCallList,schedule:renderSchedule,cadence:renderCadence,scripts:renderScripts,activity:renderActivity,stats:renderStats,production:renderProduction};
function renderTabs(){$("tabs").innerHTML=TABS.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${esc(l)}</button>`).join("")}
function renderAll(){renderTabs();TABS.forEach(([k])=>{$("p-"+k).hidden=k!==S.tab});if(!S.loaded)return;TABS.forEach(([k])=>{try{R[k]()}catch(e){$("p-"+k).innerHTML=`<div class="banner warn">This tab couldn't be drawn (${esc(e&&e.message)}). Tap Refresh.</div>`}})}
function setTab(k){S.tab=k;try{localStorage.setItem("ah:tab",k)}catch(e){}try{history.replaceState(null,"","#"+k)}catch(e){}renderTabs();TABS.forEach(([t])=>{$("p-"+t).hidden=t!==k});window.scrollTo(0,0)}

document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
  if(t.dataset.tab)return setTab(t.dataset.tab);
  if(t.id==="refresh")return load();
  if(t.dataset.stv){S.stv=t.dataset.stv;return renderStats()}
  if(t.id==="ef-more"){S.ef.limit+=25;return renderActivity()}
  if(t.id==="af-reset"){S.ef.limit=25;S.af={y:TODAY.slice(0,4),m:TODAY.slice(5,7),d:"all"};return renderActivity()}
  if(t.dataset.sv){S.sf.view=t.dataset.sv;return renderSchedule()}
  if(t.dataset.copy!=null){const x=S.scripts[+t.dataset.copy];return x&&copyText(x.text,t)}
  if(t.id==="lead-more"){S.lf.limit+=40;$("lead-results").innerHTML=leadResults()}
  if(t.id==="call-more"){S.cf.limit+=40;$("call-results").innerHTML=callResults()}});
document.addEventListener("change",e=>{const id=e.target.id,v=e.target.value;
  if(id==="ef-sort"){S.ef.sort=v;S.ef.limit=25;return renderActivity()}
  if(id==="af-y"){S.ef.limit=25;S.af.y=v;if(v==="all"){S.af.m="all";S.af.d="all"}return renderActivity()}
  if(id==="af-m"){S.ef.limit=25;S.af.m=v;S.af.d="all";return renderActivity()}
  if(id==="af-d"){S.ef.limit=25;S.af.d=v;return renderActivity()}
  if(id==="lf-type"||id==="lf-status"){S.lf[id==="lf-type"?"type":"status"]=v;S.lf.limit=40;$("lead-results").innerHTML=leadResults()}
  const m={"cf-type":"type","cf-prov":"prov","cf-cohort":"cohort","cf-step":"step"}[id];if(m){S.cf[m]=v;S.cf.limit=40;$("call-results").innerHTML=callResults()}});
document.addEventListener("input",e=>{const id=e.target.id,v=e.target.value;
  if(id==="lf-q"){S.lf.q=v;S.lf.limit=40;$("lead-results").innerHTML=leadResults()}
  if(id==="cf-q"){S.cf.q=v;S.cf.limit=40;$("call-results").innerHTML=callResults()}
  if(id==="sc-q"){S.sc.q=v;$("sc-results").innerHTML=scriptItems()}});
window.addEventListener("hashchange",()=>{const h=(location.hash||"").slice(1);if(TABS.some(x=>x[0]===h)&&h!==S.tab)setTab(h)});

renderTabs();$("p-"+S.tab).hidden=false;TABS.forEach(([k])=>{$("p-"+k).hidden=k!==S.tab});
load();
})();
</script>
